name: Bouwen en publiceren

# Eén uitgave, met alles erin. Bij een tag wordt het losse html-bestand gebouwd,
# aan de release gehangen en naar GitHub Pages gezet. Handmatig starten mag ook:
# Actions -> "Bouwen en publiceren" -> Run workflow.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  bouwen:
    runs-on: ubuntu-latest
    # Het secret staat hier op jobniveau, zodat de ondertekenstap kan kijken of hij
    # er is: in een `if` van een stap is de secrets-context niet beschikbaar.
    env:
      PRIVE_SLEUTEL: ${{ secrets.PRIVE_SLEUTEL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Importlezers testen
        run: node tests/parsers.test.js

      - name: Bouwen
        run: python3 build.py

      - name: Controleren dat er niets persoonlijks in zit
        run: |
          for term in "window.HB_LICENTIE=" "window.HB_CATS_EXTRA=" "BEGIN EC PRIVATE KEY"; do
            if grep -qF "$term" index.html; then
              echo "::error::hoort niet in een uitgave: $term"; exit 1
            fi
          done
          if grep -qE 'NL[0-9]{2}[A-Z]{4}[0-9]{10}' index.html; then
            echo "::error::er staat een iban in de build"; exit 1
          fi

      - name: Tabellen ondertekenen
        if: env.PRIVE_SLEUTEL != ''
        run: |
          pip install cryptography
          mkdir -p tools/keys
          printf '%s' "$PRIVE_SLEUTEL" > tools/keys/private.pem
          cp tools/public.b64 tools/keys/public.b64
          python3 tools/sign.py tabellen src/fiscaal.js > fiscaal-nl.txt
          rm -f tools/keys/private.pem

      - name: Aan de release hangen
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            index.html
            fiscaal-nl.txt
          generate_release_notes: true

      - name: Naar Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  publiceren:
    needs: bouwen
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - uses: actions/deploy-pages@v4
